# Base de datos PostgreSQL para el ejemplo TODO.
# Levantar con: docker compose up -d   (o npm run db:up)
services:
  db:
    image: postgres:17-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
      POSTGRES_DB: todo_app
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      # Los datos persisten en un volumen aunque se detenga el contenedor.
      - pgdata:/var/lib/postgresql/data
      # Los scripts de esta carpeta se ejecutan solo la primera vez (volumen vacío).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
